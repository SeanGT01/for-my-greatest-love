<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <defs>
    <linearGradient id="photoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E5EEDD" />
      <stop offset="100%" stop-color="#A8BFA0" />
    </linearGradient>
    <pattern id="grain" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#FFFFFF" opacity="0.3" />
      <circle cx="30" cy="25" r="1.5" fill="#355C43" opacity="0.1" />
      <circle cx="20" cy="35" r="0.8" fill="#FFFFFF" opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="500" fill="url(#photoGrad)" />
  <rect width="600" height="500" fill="url(#grain)" />

  <!-- Soft Romantic Vignette -->
  <circle cx="300" cy="220" r="160" fill="#FFFFFF" opacity="0.25" />

  <!-- Center Artwork / Illustration based on theme -->
  <g transform="translate(240, 140)">
    
    <rect x="25" y="25" width="70" height="50" rx="8" fill="#FFF9EE" stroke="#355C43" stroke-width="2.5" />
    <line x1="25" y1="50" x2="95" y2="50" stroke="#355C43" stroke-width="1.5" />
    <line x1="60" y1="25" x2="60" y2="75" stroke="#355C43" stroke-width="1.5" />
    <circle cx="42" cy="38" r="4" fill="#A8BFA0" />
    <path d="M 75 60 C 75 56, 70 56, 70 60 C 70 63, 75 66, 75 67 C 75 66, 80 63, 80 60 C 80 56, 75 56, 75 60 Z" fill="#355C43" />
  
  </g>

  <!-- Photo Title and Caption -->
  <rect x="40" y="390" width="520" height="75" rx="16" fill="#FFF9EE" opacity="0.92" />
  <text x="300" y="425" font-family="'Georgia', serif" font-size="22" font-weight="bold" fill="#355C43" text-anchor="middle">Ordinary, Perfect Days</text>
  <text x="300" y="452" font-family="'Courier New', monospace" font-size="14" fill="#666666" text-anchor="middle">Replace with assets/photos/memory-06.jpg</text>
  
  <!-- Corner tulip watermark -->
  <path d="M 25 35 Q 25 15 45 15 M 25 35 Q 45 35 45 15" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6" />
</svg>